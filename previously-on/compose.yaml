services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_RIVE_SRC: ${NEXT_PUBLIC_RIVE_SRC:-}
        NEXT_PUBLIC_UNICORN_PROJECT_ID: ${NEXT_PUBLIC_UNICORN_PROJECT_ID:-}
    env_file: .env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
